<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | FlaStore Controle</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topo">
      <div class="container barra-topo">
        <a class="marca" href="index.html">FlaStore Controle</a>
        <nav class="menu" aria-label="Menu principal">
          <a href="index.html">Início</a>
          <a href="produtos.html">Produtos</a>
          <a href="cadastro.html">Cadastro</a>
          <a href="detalhes.html">Detalhes</a>
          <button id="sairSistema" type="button">Sair</button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="titulo-pagina">
        <p>Tela de cadastro</p>
        <h1>Cadastrar produto</h1>
        <span>Preencha os dados principais do item.</span>
      </section>

      <section class="bloco">
        <form id="produtoForm" class="formulario">
          <label for="nomeProduto">Nome do produto</label>
          <input id="nomeProduto" name="nomeProduto" type="text" required />

          <label for="categoriaProduto">Categoria</label>
          <select id="categoriaProduto" name="categoriaProduto" required>
            <option value="">Selecione</option>
            <option>Camisas</option>
            <option>Acessórios</option>
            <option>Casa</option>
            <option>Kits</option>
          </select>

          <label for="precoProduto">Preço</label>
          <input id="precoProduto" name="precoProduto" type="number" min="1" step="0.01" required />

          <label for="estoqueProduto">Quantidade em estoque</label>
          <input id="estoqueProduto" name="estoqueProduto" type="number" min="0" required />

          <label for="descricaoProduto">Descrição</label>
          <textarea id="descricaoProduto" name="descricaoProduto" rows="4" required></textarea>

          <button class="botao" type="submit">Cadastrar</button>
        </form>

        <p id="mensagemCadastro" class="mensagem" role="status"></p>
      </section>
    </main>

    <footer class="rodape">
      <p>Sistema de controle de estoque</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
