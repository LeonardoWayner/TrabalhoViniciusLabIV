<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | FlaStore Controle</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="pagina-login">
    <main class="login-container">
      <section class="login-card">
        <h1>FlaStore Controle</h1>
        <p>Entre para acessar o protótipo do sistema.</p>

        <form id="loginSistemaForm" class="formulario compacto">
          <label for="emailLogin">E-mail</label>
          <input
            id="emailLogin"
            name="emailLogin"
            type="email"
            placeholder="adm@teste.com"
            required
          />

          <label for="senhaLogin">Senha</label>
          <input
            id="senhaLogin"
            name="senhaLogin"
            type="password"
            placeholder="teste"
            required
          />

          <button class="botao" type="submit">Entrar</button>
        </form>

        <p id="mensagemLogin" class="mensagem erro" role="status"></p>
        <p class="dica-login">Login: adm@teste.com | Senha: teste</p>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
