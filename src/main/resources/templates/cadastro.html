<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | FlaStore Controle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header class="topo">
      <div class="container barra-topo">
        <a class="marca" th:href="@{/}">FlaStore Controle</a>
        <nav class="menu" aria-label="Menu principal">
          <a th:href="@{/}">Início</a>
          <a th:href="@{/produtos}">Produtos</a>
          <a th:href="@{/produtos/novo}">Cadastro</a>
          <a th:href="@{/produtos/001}">Detalhes</a>
          <form th:action="@{/sair}" method="post"><button type="submit">Sair</button></form>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="titulo-pagina">
        <p>Tela de cadastro</p>
        <h1>Cadastrar produto</h1>
        <span>Preencha os dados principais do item.</span>
      </section>

      <section class="bloco">
        <form id="produtoForm" method="post" th:object="${produto}" th:action="@{/produtos}" class="formulario">
<div class="mensagem erro visivel" th:if="${#fields.hasErrors('*')}" role="alert"><p>Confira os campos informados.</p><ul><li th:each="erro : ${#fields.errors('*')}" th:text="${erro}"></li></ul></div>
          <label for="nomeProduto">Nome do produto</label>
          <input id="nomeProduto" th:field="*{nome}" name="nomeProduto" type="text" required />

          <label for="categoriaProduto">Categoria</label>
          <select id="categoriaProduto" th:field="*{categoria}" name="categoriaProduto" required>
            <option value="">Selecione</option>
            <option value="Camisas">Camisas</option>
            <option value="Acessórios">Acessórios</option>
            <option value="Casa">Casa</option>
            <option value="Kits">Kits</option>
          </select>

          <label for="precoProduto">Preço</label>
          <input id="precoProduto" th:field="*{preco}" name="precoProduto" type="number" min="1" step="0.01" required />

          <label for="estoqueProduto">Quantidade em estoque</label>
          <input id="estoqueProduto" th:field="*{estoque}" name="estoqueProduto" type="number" min="0" required />

          <label for="descricaoProduto">Descrição</label>
          <textarea id="descricaoProduto" th:field="*{descricao}" name="descricaoProduto" rows="4" required></textarea>

          <button class="botao" type="submit">Cadastrar</button>
        </form>

        <p id="mensagemCadastro" class="mensagem" role="status"></p>
      </section>
    </main>

    <footer class="rodape">
      <p>Sistema de controle de estoque</p>
    </footer>

    <script th:src="@{/js/script.js}"></script>
  </body>
</html>
